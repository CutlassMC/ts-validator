[package]
  name = "ts-validator"
  version = "0.1.0"
  edition = "2024"

[features]
  default = ["ref-impl"]
  ref-impl = ["dep:toml-schema", "backend"]
  const = ["dep:toml_const", "backend"]
  # exists so we can throw an error if no backend is selected without
  # manually checking every backend.
  backend = []

[dependencies]
  anyhow = "1.0.104"
  clap = { version = "4.6.6", features = ["cargo", "derive"] }
  ovation = "=4.0.0"
  patharg = "0.4.1"
  serde = { version = "1.0.229", features = ["derive"] }
  toml = "=0.8.23"
  clap_complete = "4.6.9"
  toml_const = { version = "1.3.1", optional = true }

  [dependencies.toml-schema]
    optional = true
    git = "https://github.com/brunoborges/toml-schema/"
    version = "1.0.0-rc.2"
    tag = "v1.0.0-rc.2"

[build-dependencies]
  anyhow = "1.0.104"
  clap = { version = "4.6.6", features = ["cargo", "derive"] }
  clap_complete = "4.6.9"
  patharg = "0.4.1"
