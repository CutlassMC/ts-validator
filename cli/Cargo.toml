[package]
  name = "ts-validator"
  version.workspace = true
  edition.workspace = true

[[bin]]
  name = "toml-schema"
  path = "src/main.rs"

[features]
  ref-impl = [ "ts-validator-lib/ref-impl" ]
  const-impl = [ "ts-validator-lib/const-impl", "dep:toml_const" ]

[dependencies]
  anyhow.workspace = true
  clap.workspace = true
  clap_complete.workspace = true
  ovation.workspace = true
  patharg.workspace = true
  toml.workspace = true
  ts-validator-lib.workspace = true

  toml_const = { version = "1.3.1", optional = true }

[build-dependencies]
  anyhow.workspace = true
  clap.workspace = true
  clap_complete.workspace = true
  patharg.workspace = true
